<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acesso PAGEVO</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: #000; color: #fff; padding: 20px; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(225,6,0,.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(225,6,0,.22) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .card {
    position: relative; z-index: 1;
    background: rgba(12,12,12,.93); color: #fff; width: 100%; max-width: 460px;
    border: 2px solid #e10600; border-radius: 20px;
    padding: clamp(28px, 6vw, 48px) clamp(20px, 5vw, 36px); text-align: center;
    box-shadow: 0 0 40px rgba(225,6,0,.45), 0 20px 50px rgba(0,0,0,.6);
    animation: enter .9s ease-out both, glow 3s ease-in-out .9s infinite;
  }
  .logo { font-size: clamp(2.2rem, 9vw, 3.6rem); font-weight: 900; letter-spacing: 2px; margin: 0 0 8px; color: #fff; }
  .logo span { color: #e10600; animation: flicker 2.2s ease-in-out infinite; }
  .chave { font-size: clamp(1.3rem, 5vw, 1.9rem); font-weight: 800; color: #e10600; margin: 0 0 28px; animation: enter 1s .25s ease-out both; }
  a.btn {
    display: inline-block; width: 100%; padding: 16px; border-radius: 12px;
    background: #e10600; color: #fff; text-decoration: none;
    font-weight: 800; font-size: 1.1rem; letter-spacing: 1px;
    transition: background .15s;
  }
  a.btn:hover { background: #b30000; }
  @keyframes enter { from { opacity: 0; transform: translateY(35px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes glow {
    0%,100% { box-shadow: 0 0 25px rgba(225,6,0,.35), 0 20px 50px rgba(0,0,0,.6); }
    50% { box-shadow: 0 0 65px rgba(225,6,0,.85), 0 20px 50px rgba(0,0,0,.6); }
  }
  @keyframes flicker { 0%,100% { text-shadow: 0 0 12px rgba(225,6,0,.9); } 50% { text-shadow: 0 0 28px rgba(225,6,0,1), 0 0 4px #ff4b44; } }
  @media (max-width: 480px) { body { padding: 14px; } a.btn { padding: 18px; } }
  @media (min-width: 1024px) { .card { max-width: 520px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
  <main class="card">
    <h1 class="logo">PAG<span>EVO</span></h1>
    <p class="chave">CHAVE 4080</p>
    <a class="btn" href="https://nucleopagevo.vercel.app">ACESSAR</a>
  </main>
</body>
</html>
